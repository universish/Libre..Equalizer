apply plugin: 'com.android.application'

android {
    namespace = "com.libre_universish.equalizer"
    compileSdk = 36
    // buildToolsVersion is managed by the plugin
    defaultConfig {
        applicationId "com.libre_universish.equalizer"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 29
        versionName "3.5.3.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    // debug signing configuration

    def debugProps = new Properties()
    def debugFile = rootProject.file("debugkey.properties")
    if (debugFile.exists()) {
        debugProps.load(new FileInputStream(debugFile))
    }

    // release stable signing conf.

    def keystorePropertiesFile = rootProject.file("releasekey.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }


    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // use Java 24 for compatibility with Kotlin jvm target; toolchain can still be 25
        sourceCompatibility JavaVersion.VERSION_24
        targetCompatibility JavaVersion.VERSION_24
    }
    // Java toolchain can follow local JDK 25 installation if needed
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }


}

// customize output APK names using new androidComponents API
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            // include versionName and versionCode in file name
            def vName = variant.versionName ?: ""
            def vCode = variant.versionCode ?: ""
            output.outputFileName.set("libre_universish-equalizer-v${vName}-vc_${vCode}-${variant.name}.apk")
        }
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    // core utilities (open source)
    // core utilities (open source)
    implementation "org.apache.commons:commons-lang3:3.20.0"
    implementation "com.google.code.gson:gson:2.13.2"
    // Kotlin coroutines used transitively by some AndroidX libraries
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"

    // AndroidX libraries updated for compileSdk 36
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'  // still current
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'

    // lifecycle / viewmodel / room
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.10.0'
    // note: lifecycle-extensions deprecated, replaced above
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'

    // testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.6.1') {
        exclude group: 'androidx.test', module: 'test-annotations'
    }

    // remove in-app billing; no closed-source dependencies
}

// ensure all kotlin stdlib references use a single enforced version
configurations.all {
    resolutionStrategy {
        // enforce single Kotlin stdlib version (use latest cached to satisfy new libs)
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.10'
        // force AndroidX core and vectordrawable to versions compatible with compileSdk 36
        force 'androidx.core:core:1.17.0'
        force 'androidx.vectordrawable:vectordrawable:1.2.0'
    }
}

// configure any Kotlin compile tasks (added by AGP) to target JVM 24
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "24"
    }
}

// navigation-related resource tasks sometimes crash when nav component not used; disable
tasks.matching { it.name.contains("NavigationResources") }.configureEach {
    enabled = false
}

// ensure navigation output directories exist to satisfy resource linking
afterEvaluate {
    tasks.matching { it.name.contains("processDebugResources") }.configureEach { task ->
        task.doFirst {
            def dirs = [
                "$buildDir/generated/updated_navigation_xml/debug",
                "$buildDir/intermediates/compiled_navigation_res/debug/compileDebugNavigationResources"
            ]
            dirs.each { String p ->
                def f = file(p)
                if (!f.exists()) {
                    f.mkdirs()
                }
            }
        }
    }
}

// debug: print parseDebugLocalResources input directories before execution
afterEvaluate {
    tasks.matching { it.name == 'parseDebugLocalResources' }.configureEach { task ->
        doFirst {
            // ensure missing navigation resources directory exists
            def inav = task.inputNavigationResourcesDir
            if (inav != null && inav.isPresent()) {
                File navFile = inav.get().asFile
                if (!navFile.exists()) {
                    navFile.mkdirs()
                }
            }
        }
    }
}

